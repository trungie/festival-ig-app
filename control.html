<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ULTRA JUJU 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #fff;
  color: #262626;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ── IG Header ── */
.ig-header {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: #fff;
  border-bottom: 1px solid #efefef;
}
.ig-header .logo {
  font-size: 22px;
  font-weight: 700;
  background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ── Stories Bar ── */
.stories-bar {
  display: flex;
  gap: 12px;
  padding: 10px 16px;
  border-bottom: 1px solid #efefef;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.stories-bar::-webkit-scrollbar { display: none; }

.story-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.story-ring {
  width: 62px;
  height: 62px;
  border-radius: 50%;
  padding: 2px;
  background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
}
.story-ring-inner {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 2px solid #fff;
  overflow: hidden;
  background: #f0f0f0;
}
.story-ring-inner img { width: 100%; height: 100%; object-fit: cover; }
.story-name {
  font-size: 11px;
  color: #262626;
  max-width: 64px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: center;
}

/* ── Post ── */
.post { border-bottom: 1px solid #efefef; }
.post-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
}
.post-header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.post-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  object-fit: cover;
  background: #f0f0f0;
}
.post-username { font-size: 13px; font-weight: 600; }

.post-media {
  width: 100%;
  aspect-ratio: 1;
  background: #f0f0f0;
  position: relative;
}
.post-media img, .post-media video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.post-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px 6px;
}
.post-actions-left { display: flex; gap: 16px; }
.post-actions svg { width: 24px; height: 24px; }

.post-likes {
  font-size: 13px;
  font-weight: 600;
  padding: 0 14px 4px;
}
.post-caption {
  font-size: 13px;
  padding: 0 14px 4px;
  line-height: 1.4;
}
.post-caption .cap-user { font-weight: 600; margin-right: 4px; }
.post-comments { padding: 0 14px 8px; }
.post-comment {
  font-size: 13px;
  margin-bottom: 2px;
  line-height: 1.4;
}
.post-comment .cmt-user { font-weight: 600; margin-right: 4px; }
.post-time {
  font-size: 10px;
  color: #8e8e8e;
  padding: 0 14px 12px;
  text-transform: uppercase;
}

/* ── Bottom Nav ── */
.ig-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 10px 0 env(safe-area-inset-bottom, 8px);
  background: #fff;
  border-top: 1px solid #efefef;
  z-index: 30;
}
.ig-nav svg { width: 24px; height: 24px; }

/* ── iOS Push Notification (tap to dismiss) ── */
.ios-notification {
  position: fixed;
  top: 0;
  left: 8px;
  right: 8px;
  z-index: 100;
  transform: translateY(-120%);
  transition: transform 0.45s cubic-bezier(0.23, 1, 0.32, 1);
}
.ios-notification.visible { transform: translateY(env(safe-area-inset-top, 12px)); }
.notif-card {
  background: rgba(250, 250, 250, 0.92);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border-radius: 20px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.notif-icon {
  width: 38px;
  height: 38px;
  border-radius: 8px;
  flex-shrink: 0;
  background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
  display: flex;
  align-items: center;
  justify-content: center;
}
.notif-icon svg { width: 22px; height: 22px; fill: #fff; }
.notif-content { flex: 1; min-width: 0; }
.notif-app {
  font-size: 13px;
  font-weight: 600;
  color: #262626;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.notif-text {
  font-size: 14px;
  color: #444;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.notif-time { font-size: 12px; color: #8e8e8e; flex-shrink: 0; }
.notif-hint {
  font-size: 11px;
  color: #aaa;
  text-align: center;
  margin-top: 6px;
}

/* Feed spacer for bottom nav */
.feed-spacer { height: 70px; }

/* Connection lost banner */
.conn-banner {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  background: #ef4444;
  color: #fff;
  text-align: center;
  padding: 4px;
  font-size: 12px;
  z-index: 200;
  display: none;
}
.conn-banner.show { display: block; }
</style>
</head>
<body>

<div class="conn-banner" id="conn-banner">Reconnecting...</div>

<!-- iOS Push Notification -->
<div class="ios-notification" id="notification" onclick="dismissNotification()">
  <div class="notif-card">
    <div class="notif-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
    </div>
    <div class="notif-content">
      <div class="notif-app">Instagram</div>
      <div class="notif-text" id="notif-text">ultrajuju2026 posted a new photo</div>
    </div>
    <div class="notif-time">now</div>
  </div>
  <div class="notif-hint">Tap to dismiss</div>
</div>

<!-- IG Header -->
<div class="ig-header">
  <div class="logo">ULTRA JUJU 2026</div>
</div>

<!-- Stories Bar -->
<div class="stories-bar">
  <div class="story-item">
    <div class="story-ring"><div class="story-ring-inner"><img src="./assets/avatars/juju.png" alt=""></div></div>
    <span class="story-name">ultrajuju</span>
  </div>
  <div class="story-item">
    <div class="story-ring"><div class="story-ring-inner"><img src="./assets/avatars/juju.png" alt=""></div></div>
    <span class="story-name">mainstage</span>
  </div>
  <div class="story-item">
    <div class="story-ring"><div class="story-ring-inner"><img src="./assets/avatars/juju.png" alt=""></div></div>
    <span class="story-name">backstage</span>
  </div>
  <div class="story-item">
    <div class="story-ring"><div class="story-ring-inner"><img src="./assets/avatars/juju.png" alt=""></div></div>
    <span class="story-name">vibes</span>
  </div>
</div>

<!-- Feed -->
<div id="feed"></div>
<div class="feed-spacer"></div>

<!-- Bottom Nav -->
<div class="ig-nav">
  <svg viewBox="0 0 24 24" fill="#262626"><path d="M9.005 16.545a2.997 2.997 0 012.997-2.997h0A2.997 2.997 0 0115 16.545V22h7V11.543L12 2 2 11.543V22h7.005z"/></svg>
  <svg viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
  <svg viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M10 8l6 4-6 4V8z" fill="#262626"/></svg>
  <svg viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4zM3 6h18M16 10a4 4 0 01-8 0"/></svg>
  <svg viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
</div>

<script>
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderPost(post, index) {
  const isVideo = post.type === 'video';
  const commentsHTML = (post.comments || []).map(c =>
    `<div class="post-comment"><span class="cmt-user">${esc(c.user)}</span>${esc(c.text)}</div>`
  ).join('');

  let mediaHTML = isVideo
    ? `<video src="${esc(post.media)}" preload="metadata" playsinline muted loop style="width:100%;height:100%;object-fit:cover"></video>`
    : `<img src="${esc(post.media)}" alt="" loading="lazy">`;

  return `
    <div class="post" id="post-${esc(post.id)}" data-index="${index}">
      <div class="post-header">
        <div class="post-header-left">
          <img class="post-avatar" src="${esc(post.avatar)}" alt="">
          <span class="post-username">${esc(post.username)}</span>
        </div>
      </div>
      <div class="post-media">${mediaHTML}</div>
      <div class="post-actions">
        <div class="post-actions-left">
          <svg viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </div>
        <svg viewBox="0 0 24 24" fill="none" stroke="#262626" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
      </div>
      <div class="post-likes">${esc(post.likes)} likes</div>
      <div class="post-caption"><span class="cap-user">${esc(post.username)}</span>${esc(post.caption)}</div>
      <div class="post-comments">${commentsHTML}</div>
      <div class="post-time">Just now</div>
    </div>`;
}

function renderFeed(activePosts) {
  document.getElementById('feed').innerHTML = activePosts.map((p, i) => renderPost(p, i)).join('');
}

function scrollToPost(index) {
  const el = document.querySelector(`.post[data-index="${index}"]`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function showNotification(text) {
  document.getElementById('notif-text').textContent = text || 'ultrajuju2026 posted a new photo';
  document.getElementById('notification').classList.add('visible');
}

function hideNotification() {
  document.getElementById('notification').classList.remove('visible');
}

function dismissNotification() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'dismiss-notify' }));
  }
  hideNotification();
}

// ── WebSocket ──
let ws;
function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}`);

  ws.onopen = () => {
    document.getElementById('conn-banner').classList.remove('show');
    ws.send(JSON.stringify({ type: 'register', role: 'control' }));
  };

  ws.onclose = () => {
    document.getElementById('conn-banner').classList.add('show');
    setTimeout(connect, 2000);
  };

  ws.onerror = () => ws.close();

  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }

    switch (msg.type) {
      case 'state':
        renderFeed(msg.posts.active || []);
        if (msg.notificationActive) showNotification(msg.notificationText);
        else hideNotification();
        setTimeout(() => scrollToPost(msg.currentIndex), 100);
        break;
      case 'scroll':
        if (!msg.notificationActive) hideNotification();
        scrollToPost(msg.currentIndex);
        break;
      case 'notification':
        if (msg.active) showNotification(msg.text);
        else hideNotification();
        break;
      case 'reload':
        location.reload();
        break;
    }
  };
}
connect();
</script>
</body>
</html>
