<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Controls — ULTRA JUJU 2026</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #111;
  color: #eee;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}

/* ── Title ── */
.title {
  text-align: center;
  padding: 16px 16px 8px;
  flex-shrink: 0;
}
.title h1 {
  font-size: 22px;
  background: linear-gradient(90deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.title .subtitle {
  font-size: 13px;
  color: #888;
  margin-top: 2px;
}

/* ── Post Indicator ── */
.indicator {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  flex-shrink: 0;
  min-height: 0;
}
.indicator .label {
  font-size: 42px;
  font-weight: 700;
  letter-spacing: -1px;
}
.indicator .label strong {
  color: #60a5fa;
}

/* ── Dismiss Button ── */
.dismiss-btn {
  display: none;
  width: calc(100% - 32px);
  margin: 0 16px 12px;
  padding: 22px;
  border: none;
  border-radius: 16px;
  font-size: 19px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #f09433, #dc2743, #bc1888);
  cursor: pointer;
  flex-shrink: 0;
  transition: opacity 0.15s, transform 0.1s;
}
.dismiss-btn:active { opacity: 0.85; transform: scale(0.98); }
.dismiss-btn.visible { display: block; }

/* ── Nav Row ── */
.nav-row {
  display: flex;
  gap: 10px;
  padding: 0 16px 16px;
  flex-shrink: 0;
}
.nav-btn {
  flex: 1;
  height: 100px;
  border: none;
  border-radius: 16px;
  font-size: 24px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
}
.nav-btn:active { opacity: 0.85; transform: scale(0.97); }
.nav-btn.back { background: #333; color: #eee; }
.nav-btn.next { background: #3b82f6; color: #fff; }

/* ── Connection Indicator ── */
.conn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 16px;
  padding-bottom: max(10px, env(safe-area-inset-bottom));
  flex-shrink: 0;
}
.conn-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #ef4444;
}
.conn-dot.on { background: #22c55e; }
.conn-text {
  font-size: 13px;
  color: #888;
}
</style>
</head>
<body>

<div class="title">
  <h1>ULTRA JUJU 2026</h1>
  <div class="subtitle">Stream Controls</div>
</div>

<div class="indicator">
  <div class="label">Post <strong id="idx">0</strong> of <strong id="total">0</strong></div>
</div>

<button class="dismiss-btn" id="btn-dismiss" onclick="send({type:'dismiss-notify'})">Dismiss Notification</button>

<div class="nav-row">
  <button class="nav-btn back" onclick="send({type:'back'})">&#9664; Back</button>
  <button class="nav-btn next" onclick="send({type:'next'})">Next &#9654;</button>
</div>

<div class="conn">
  <div class="conn-dot" id="conn-dot"></div>
  <span class="conn-text" id="conn-text">Connecting...</span>
</div>

<script>
let ws;
let currentState = {};
let pollTimer = null;
let restOk = false;

function updateUI(s) {
  currentState = s;
  const active = (s.posts && s.posts.active) || [];
  document.getElementById('idx').textContent = active.length > 0 ? s.currentIndex + 1 : 0;
  document.getElementById('total').textContent = active.length;

  const dismissBtn = document.getElementById('btn-dismiss');
  if (s.notificationActive) dismissBtn.classList.add('visible');
  else dismissBtn.classList.remove('visible');
}

function send(msg) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(msg));
  } else {
    fetch('/api/command', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(msg)
    })
      .then(r => r.json())
      .then(data => { if (data.state) updateUI(data.state); })
      .catch(() => {});
  }
}

function setConnStatus(mode) {
  // mode: 'ws' | 'rest' | 'off'
  const dot = document.getElementById('conn-dot');
  const text = document.getElementById('conn-text');
  if (mode === 'ws') {
    dot.className = 'conn-dot on';
    text.textContent = 'Connected';
  } else if (mode === 'rest') {
    dot.className = 'conn-dot on';
    text.textContent = 'Connected (polling)';
  } else {
    dot.className = 'conn-dot';
    text.textContent = 'Reconnecting...';
  }
}

function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(() => {
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      fetch('/api/state')
        .then(r => r.json())
        .then(data => {
          updateUI(data);
          restOk = true;
          setConnStatus('rest');
        })
        .catch(() => {
          restOk = false;
          setConnStatus('off');
        });
    }
  }, 2000);
}

function stopPolling() {
  clearInterval(pollTimer);
  pollTimer = null;
}

let wsLoggedError = false;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${proto}//${location.host}`;
  ws = new WebSocket(url);

  ws.onopen = () => {
    console.log('[Controls] WS connected');
    wsLoggedError = false;
    setConnStatus('ws');
    stopPolling();
    ws.send(JSON.stringify({ type: 'register', role: 'controls' }));
  };

  ws.onclose = (e) => {
    if (!wsLoggedError) {
      console.log('[Controls] WS closed:', e.code, e.reason);
      wsLoggedError = true;
    }
    if (!restOk) setConnStatus('off');
    startPolling();
    setTimeout(connect, 2000);
  };

  ws.onerror = () => ws.close();

  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }

    switch (msg.type) {
      case 'state':
        updateUI(msg);
        break;
      case 'scroll':
        currentState.currentIndex = msg.currentIndex;
        currentState.notificationActive = msg.notificationActive || false;
        updateUI(currentState);
        break;
      case 'notification':
        currentState.notificationActive = msg.active;
        updateUI(currentState);
        break;
      case 'reload':
        location.reload();
        break;
    }
  };
}

connect();
</script>
</body>
</html>
